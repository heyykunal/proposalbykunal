<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Proposal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #ffe6f2;
            color: #d63384;
            margin-top: 50px;
            overflow: hidden;
        }
        h1 {
            font-size: 30px;
            font-weight: 600;
        }
        /* Button Styles */

        .btn {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 15px auto;
    font-weight: 400;
    display: block;
    width: 200px;
    transition: all 0.2s ease-in-out;
    box-shadow: 0 5px 0px #b52d3a, 0 8px 15px rgba(0, 0, 0, 0.2);
    position: relative;
}

.btn:active {
    transform: translateY(5px);
    box-shadow: 0 2px 0px #b52d3a, 0 5px 10px rgba(0, 0, 0, 0.2);
}

.btn-positive {
    background-color: #28a745;
    color: white;
    box-shadow: 0 5px 0px #1e7e34, 0 8px 15px rgba(0, 0, 0, 0.2);
}

.btn-positive:active {
    box-shadow: 0 2px 0px #1e7e34, 0 5px 10px rgba(0, 0, 0, 0.2);
}

.btn-negative {
    background-color: #dc3545;
    color: white;
    box-shadow: 0 5px 0px #a71d2a, 0 8px 15px rgba(0, 0, 0, 0.2);
}

.btn-negative:active {
    box-shadow: 0 2px 0px #a71d2a, 0 5px 10px rgba(0, 0, 0, 0.2);
}

        .btn {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 15px auto;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
            font-weight: 400;
            transition: all 0.3s ease-in-out;
            display: block;
            width: 200px;
        }
        .btn-positive {
            background-color: #28a745;
            color: white;
        }
        .btn-positive:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
        .btn-negative {
            background-color: #dc3545;
            color: white;
        }
        .btn-negative:hover {
            background-color: #c82333;
            transform: scale(1.05);
        }
        img {
            width: 250px;
            height: auto;
            margin: 20px;
            border-radius: 15px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
        }
        /* Heartfall Effect */
        .heart {
            position: absolute;
            color: red;
            font-size: 30px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .love-shower {
            font-size: 50px;
            color: red;
            font-weight: 600;
            animation: loveFade 1.5s infinite alternate;
        }
        @keyframes loveFade {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
        /* Shaking Effect */
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
    </style>
</head>
<body>
    <div id="page1">
        <h1>Will you be my Valentine, Ujju? ❤️</h1>
        <img src="img1.png" alt="Cute Love">
        <br>
        <button class="btn btn-negative" onclick="nextPage('page2')">Bilkul Nhi</button>
        <button class="btn btn-positive" onclick="nextPage('page2')">Sochna Pdega</button>
    </div>

    <div id="page2" style="display: none;">
        <h1>Kya sochna pdega yaar! 🤨</h1>
        <img src="img2.png" alt="Thinking Emoji">
        <br>
        <button class="btn btn-positive" onclick="nextPage('page3')">Gini Mini se puchna pdega</button>
        <button class="btn btn-negative" onclick="alert('Mumma se puchna pdega? Ab kya bataun 😅')">Mumma se puchna pdega</button>
    </div>

    <div id="page3" style="display: none;">
        <h1>Cutie Gini and Cutie Mini ki taraf se Haan hai! 😍<br>Now your turn...</h1>
        <img src="img3.png" alt="Cute Animals">
        <br>
        <button class="btn btn-positive" id="yesBtn" onclick="moveYesButton()">Yes</button>
        <button class="btn btn-negative" id="hateBtn" onclick="changeHateButtonText(this)">I hate you 😡</button>
    </div>

    <div id="finalPage" style="display: none;">
        <h1 class="love-shower">Wowwww! I love youuuu so much! ❤️💖💞💕💗💓💘💝</h1>
        <img src="img4.png" alt="Love Shower">
    </div>

    <script>
        let yesClickCount = 0;
        function nextPage(pageId) {
            document.querySelectorAll('div').forEach(div => div.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';

            if (pageId === 'finalPage') {
                startHeartfall();
                playSound('loveSound.mp3');
            } else {
                playSound('click.mp3');
            }
        }

        function moveYesButton() {
            yesClickCount++;
            if (yesClickCount < 5) {
                let yesBtn = document.getElementById("yesBtn");
                let maxX = window.innerWidth - 220;
                let maxY = window.innerHeight - 100;
                let x = Math.random() * maxX;
                let y = Math.random() * maxY;
                
                yesBtn.style.position = "absolute";
                yesBtn.style.left = x + "px";
                yesBtn.style.top = y + "px";
                yesBtn.classList.add("shake");
                
                setTimeout(() => yesBtn.classList.remove("shake"), 300);
                playSound('move.mp3');
            } else {
                nextPage('finalPage');
            }
        }

        function changeHateButtonText(button) {
            button.textContent = "Pyaar me hi Nafrat hai ❤️";
            playSound('cute.mp3');
        }

        function startHeartfall() {
            for (let i = 0; i < 30; i++) {
                let heart = document.createElement("div");
                heart.classList.add("heart");
                heart.innerHTML = "❤️";
                document.body.appendChild(heart);
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = Math.random() * 2 + 3 + "s";
                setTimeout(() => heart.remove(), 5000);
            }
        }

        function playSound(filename) {
            let audio = new Audio(filename);
            audio.play();
        }
    </script>
</body>
</html>
